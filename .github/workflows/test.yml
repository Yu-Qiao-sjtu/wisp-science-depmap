name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix docs
      - run: npm test --prefix docs
      - run: npm run build --prefix docs
      - run: npm ci
        working-directory: ui-tests
      - run: npx playwright install --with-deps chromium
        working-directory: ui-tests
      - run: npx playwright test --config playwright.website.config.ts
        working-directory: ui-tests

  release-notes-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release-notes title helper
        run: bash scripts/github_release_notes.sh --self-test

  headless-agent-eval:
    name: Headless agent eval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: headless-agent-${{ matrix.os }}

      - name: Run MCP process-tree shutdown regression
        run: cargo test -p wisp-mcp --test process_tree_shutdown

      # Interpreters are often launchers: Windows Rscript.exe re-launches
      # bin\x64\Rscript.exe through cmd.exe. Stopping a runtime must reclaim
      # that whole tree, which only a real per-OS process tree can prove.
      - name: Run runtime worker process-tree regression
        run: cargo test -p wisp-runtime --test worker_process_tree

# Exercise the Python worker and standalone skill helpers on both supported
      # desktop platforms, including process handling and project-relative paths.
      - name: Run Python worker and skill helper tests (macOS)
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s python -p "test_*.py" -v

      # python3 is not on PATH on windows-latest; the launcher is `python`.
      - name: Run Python worker and skill helper tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s python -p "test_*.py" -v

      - name: Run deterministic headless agent suite
        run: cargo run -p wisp-cli -- eval --artifacts target/headless-agent-eval --save target/headless-agent-eval/report.json

      - name: Upload headless eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-agent-eval-${{ matrix.os }}
          path: target/headless-agent-eval
          if-no-files-found: error

  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: 1.88.0
    steps:
      - uses: actions/checkout@v4

      # Keep the workspace MSRV explicit; floating stable alone does not catch
      # accidental dependency bumps past the version declared in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true
          shared-key: rust-${{ matrix.os }}-${{ matrix.toolchain }}

      - name: cargo test --workspace
        # GitHub's arm64 macOS runner rejects this one harness-less test when
        # it re-executes itself. The separate process_tree_shutdown regression
        # still exercises MCP child-process ownership on macOS, while the full
        # mcp_transport regression continues to run on Windows.
        env:
          WISP_SKIP_MCP_TRANSPORT_SELF_EXEC: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: cargo test --workspace

      - name: cargo check (wasm UI crate)
        run: cargo check --target wasm32-unknown-unknown
        working-directory: ui

  ui-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui -> target
          cache-on-failure: true

      - name: Cache Trunk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: trunk-${{ runner.os }}-v1

      - name: Install Trunk
        shell: pwsh
        run: |
          if (-not (Get-Command trunk -ErrorAction SilentlyContinue)) {
            cargo install trunk --locked
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright deps
        working-directory: ui-tests
        run: npm ci

      - name: Install Chromium
        working-directory: ui-tests
        run: npx playwright install chromium

      - name: Playwright E2E
        working-directory: ui-tests
        run: npx playwright test
