name: Deploy website to Cloudflare

on:
  push:
    branches: [main]
    paths: ['docs/**', 'skills/**', '.github/workflows/docs-cloudflare-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Build and test website
        run: |
          npm ci --prefix docs
          python -m pip install -r docs/requirements-pages.txt
          python docs/build_tutorials.py
          python docs/build_skills.py
          python -m unittest discover -s docs -p 'test_build_*.py'
          npm test --prefix docs
          npm run build --prefix docs
      - name: Deploy website and download Worker
        run: npm run deploy --prefix docs
