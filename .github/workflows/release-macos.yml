name: macOS Release

# This repository ships Windows and Linux installers only. Keep the workflow
# name so older docs/links still resolve; do not run on version tags.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused; macOS installers are not published
        required: false
        default: none

permissions:
  contents: read

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Do not publish macOS installers
        run: echo "wisp-depmap does not publish macOS installers."
