<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Structure viewer</title>
  <link rel="stylesheet" href="vendor-runtime/molstar-viewer-5.12.0.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #f6f7f8; font: 12px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 0; position: relative; }
    #viewer { position: relative; flex: 1 1 auto; min-height: 0; }
    #status {
      position: absolute; left: 10px; bottom: 8px; z-index: 10;
      color: #3c4043; background: rgba(255, 255, 255, .85);
      padding: 3px 8px; border-radius: 4px; max-width: 70%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status.error { color: #b3261e; }
    #tools {
      position: relative; flex: 0 0 auto; z-index: 10;
      display: flex; gap: 6px; align-items: center;
      padding: 6px 8px; background: #fff; border-bottom: 1px solid #dadce0;
      overflow: hidden;
    }
    #selection-echo, #recent {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #tools input, #tools button {
      font: inherit; border: 1px solid #dadce0; border-radius: 4px; background: #fff; padding: 3px 6px;
    }
    #selection-echo { color: #3c4043; }
  </style>
</head>
<body>
  <div id="tools">
    <input id="selection" type="text" placeholder="name CA and polymer.protein" />
    <button id="apply-selection" type="button">Select</button>
    <span id="selection-echo"></span>
    <span id="recent"></span>
  </div>
  <div id="viewer"></div>
  <div id="status">initializing viewer…</div>
  <script src="vendor-runtime/molstar-viewer-5.12.0.js"></script>
  <script src="viewer_controls.js"></script>
  <script>
    (async function () {
      'use strict';
      var statusEl = document.getElementById('status');
      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.className = isError ? 'error' : '';
      }

      var FORMAT_BY_EXT = { pdb: 'pdb', ent: 'pdb', cif: 'cif', mmcif: 'mmcif', gro: 'gro' };
      // Coordinate formats parsed by Mol* mol-io; `.nc` is GROMACS' alternate
      // extension for the same NetCDF container (#193).
      var TRAJ_FORMAT_BY_EXT = { dcd: 'dcd', xtc: 'xtc', trr: 'trr', netcdf: 'netcdf', nc: 'netcdf' };
      function extensionOf(path) {
        var match = /\.([A-Za-z0-9]+)$/.exec(path || '');
        return match ? match[1].toLowerCase() : null;
      }
      function formatFor(table, kind, path) {
        var ext = extensionOf(path);
        if (!ext) throw new Error(kind + ' path has no extension: ' + path);
        var format = table[ext];
        if (!format) throw new Error('unsupported ' + kind + ' extension: ' + ext);
        return format;
      }
      function queryParam(name) {
        var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return match ? decodeURIComponent(match[1]) : null;
      }
      function basename(path) { return path.replace(/^.*[\\/]/, ''); }
      function bytesToU8(bytes) { return new Uint8Array(bytes); }

      var viewer = null;
      var loadSeq = 0;

      function showStructure(path, selection) {
        var seq = ++loadSeq;
        var name = basename(path);
        setStatus('loading ' + name + '…', false);
        var format;
        try { format = formatFor(FORMAT_BY_EXT, 'structure', path); }
        catch (error) { setStatus(String(error.message || error), true); return; }
        window.__TAURI__.core.invoke('read_structure_bytes', { path: path })
          .then(function (bytes) {
            if (seq !== loadSeq) return; // a newer load superseded this one
            // Slice 1 formats (pdb/cif/mmcif/gro) are all text; decode and hand
            // the string to Mol*.
            var data = new TextDecoder().decode(bytesToU8(bytes));
            return viewer.loadStructureFromData(data, format);
          })
          .then(function () {
            if (seq !== loadSeq) return;
            setStatus(name, false);
            // Highlight only this load. A newer pose increments loadSeq and
            // this callback becomes a no-op, so it cannot mark the old scene.
            if (selection) {
              document.getElementById('selection').value = selection;
              applySelection(selection);
            }
          })
          .catch(function (error) {
            if (seq === loadSeq) setStatus(String((error && error.message) || error), true);
          });
      }

      // Trajectory mode (#193): topology text + binary coordinates go through
      // Mol*'s built-in pipeline (loadTrajectory), which wires the mol-io
      // DCD/XTC/TRR/NetCDF readers, the coordinate transform and the animation
      // preset - playback controls come from the vendored viewer itself.
      function showTrajectory(structurePath, trajectoryPath) {
        var seq = ++loadSeq;
        var topoName = basename(structurePath);
        var trajName = basename(trajectoryPath);
        setStatus('loading ' + topoName + ' + ' + trajName + '…', false);
        var topoFormat, trajFormat;
        try {
          topoFormat = formatFor(FORMAT_BY_EXT, 'structure', structurePath);
          trajFormat = formatFor(TRAJ_FORMAT_BY_EXT, 'trajectory', trajectoryPath);
        } catch (error) { setStatus(String(error.message || error), true); return; }
        var invoke = window.__TAURI__.core.invoke;
        Promise.all([
          invoke('read_structure_bytes', { path: structurePath }).then(bytesToU8),
          invoke('read_trajectory_bytes', { path: trajectoryPath }).then(bytesToU8),
        ])
          .then(function (parts) {
            if (seq !== loadSeq) return;
            return viewer.loadTrajectory({
              model: {
                kind: 'model-data',
                data: new TextDecoder().decode(parts[0]),
                format: topoFormat,
              },
              modelLabel: topoName,
              coordinates: {
                kind: 'coordinates-data',
                data: parts[1], // binary; Mol* readers consume the raw buffer
                format: trajFormat,
              },
              coordinatesLabel: trajName,
            });
          })
          .then(function () {
            if (seq === loadSeq) setStatus(topoName + ' + ' + trajName, false);
          })
          .catch(function (error) {
            if (seq === loadSeq) setStatus(String((error && error.message) || error), true);
          });
      }

      try {
        viewer = await molstar.Viewer.create(document.getElementById('viewer'), {
          layoutIsExpanded: true,
          layoutShowControls: true,
          layoutShowLeftPanel: true,
          viewportShowExpand: true,
          viewportShowControls: true,
          viewportShowSettings: true,
          viewportShowSelectionMode: true,
          // Animation controls only appear once a trajectory is loaded; safe
          // to keep enabled for the static-structure case too (#193).
          viewportShowAnimation: true
        });
      } catch (error) {
        setStatus('failed to initialize Mol* viewer: ' + String((error && error.message) || error), true);
        return;
      }

      var initial = queryParam('src');
      var initialTopo = queryParam('topo');
      var initialTraj = queryParam('traj');
      if (initial) showStructure(initial, queryParam('sel'));
      else if (initialTopo && initialTraj) showTrajectory(initialTopo, initialTraj);

      try {
        // Reuse path: a window kept open receives later content via these
        // events instead of a disruptive navigation (#192 / #195).
        window.__TAURI__.event.listen('viewer://load-structure', function (event) {
          var path = event && event.payload && event.payload.path;
          var selection = event && event.payload && event.payload.selection;
          if (path) showStructure(path, selection || null);
        });
        window.__TAURI__.event.listen('viewer://load-trajectory', function (event) {
          var payload = event && event.payload;
          if (payload && payload.structure_path && payload.trajectory_path) {
            showTrajectory(payload.structure_path, payload.trajectory_path);
          }
        });
        window.__TAURI__.event.listen('viewer://select', function (event) {
          var expression = event && event.payload && event.payload.expression;
          if (expression) applySelection(expression);
        });
        window.__TAURI__.event.listen('viewer://control-camera', function (event) {
          applyCamera(event && event.payload);
        });
      } catch (error) {
        /* event bridge unavailable (plain browser preview) */
      }

      function applySelection(expression) {
        var echo = document.getElementById('selection-echo');
        echo.textContent = expression;
        try {
          var matched = ViewerControls.highlightPymol(molstar, viewer.plugin, expression);
          setStatus(matched ? expression : 'no atoms matched ' + expression, matched === 0);
        } catch (error) {
          setStatus(String((error && error.message) || error), true);
        }
      }

      function applyCamera(payload) {
        if (!payload || !payload.action) return;
        try {
          ViewerControls.applyCameraPayload(molstar, viewer.plugin, payload);
          setStatus('camera ' + payload.action, false);
        } catch (error) {
          setStatus(String((error && error.message) || error), true);
        }
      }

      document.getElementById('apply-selection').addEventListener('click', function () {
        applySelection(document.getElementById('selection').value);
      });
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.setInterval(function () {
          window.__TAURI__.core.invoke('ui_heartbeat', { snapshot: null }).catch(function () {});
        }, 15000);
      }
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('list_viewer_recent').then(function (paths) {
          document.getElementById('recent').textContent = (paths || []).slice(0, 3).map(function (path) {
            return path.replace(/^.*[\\/]/, '');
          }).join(' · ');
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
