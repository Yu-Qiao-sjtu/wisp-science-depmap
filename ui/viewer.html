<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Structure viewer</title>
  <link rel="stylesheet" href="vendor-runtime/molstar-viewer-5.12.0.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #f6f7f8; font: 12px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 0; position: relative; }
    #viewer { position: relative; flex: 1 1 auto; min-height: 0; }
    #status {
      position: absolute; left: 10px; bottom: 8px; z-index: 10;
      color: #3c4043; background: rgba(255, 255, 255, .85);
      padding: 3px 8px; border-radius: 4px; max-width: 70%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status.error { color: #b3261e; }
    #tools {
      position: relative; flex: 0 0 auto; z-index: 10;
      display: flex; gap: 6px; align-items: center;
      padding: 6px 8px; background: #fff; border-bottom: 1px solid #dadce0;
      overflow: hidden;
    }
    #selection-echo, #recent {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #tools input, #tools button {
      font: inherit; border: 1px solid #dadce0; border-radius: 4px; background: #fff; padding: 3px 6px;
    }
    #selection-echo { color: #3c4043; }
    #viewer { --side-left: 330px; --side-right: 300px; }
    #viewer .msp-plugin .msp-layout-expanded { position: absolute; }
    #viewer .msp-plugin .msp-layout-expanded .msp-layout-left { width: var(--side-left); }
    #viewer .msp-plugin .msp-layout-expanded .msp-layout-right { width: var(--side-right); }
    #viewer .msp-plugin .msp-layout-expanded .msp-layout-main,
    #viewer .msp-plugin .msp-layout-expanded .msp-layout-top,
    #viewer .msp-plugin .msp-layout-expanded .msp-layout-bottom {
      left: var(--side-left); right: var(--side-right);
    }
    .splitter {
      position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px;
      cursor: col-resize; z-index: 8;
    }
    #splitter-left { left: var(--side-left); }
    #splitter-right { right: var(--side-right); margin-left: 0; margin-right: -3px; }
  </style>
</head>
<body>
  <div id="tools">
    <input id="selection" type="text" placeholder="name CA and polymer.protein" />
    <button id="apply-selection" type="button" data-i18n="button.select">Select</button>
    <button id="zoom-selection" type="button" data-i18n="button.zoom">Zoom</button>
    <button id="label-selection" type="button" aria-pressed="false" data-i18n="button.label">Label</button>
    <button id="measure-distance" type="button" aria-pressed="false" data-i18n="button.distance">Distance</button>
    <select id="color-mode" data-i18n-title="hint.color" title="Color by element, chain, spectrum, or a solid color">
      <option value="element" data-i18n="color.element">Element</option>
      <option value="chain" data-i18n="color.chain">Chain</option>
      <option value="spectrum" data-i18n="color.spectrum">Spectrum</option>
      <option value="red" data-i18n="color.red">Red</option>
      <option value="green" data-i18n="color.green">Green</option>
      <option value="blue" data-i18n="color.blue">Blue</option>
      <option value="yellow" data-i18n="color.yellow">Yellow</option>
      <option value="cyan" data-i18n="color.cyan">Cyan</option>
      <option value="magenta" data-i18n="color.magenta">Magenta</option>
      <option value="orange" data-i18n="color.orange">Orange</option>
      <option value="white" data-i18n="color.white">White</option>
      <option value="gray" data-i18n="color.gray">Gray</option>
      <option value="clear-paint" data-i18n="color.clearPaint">Clear paint</option>
    </select>
    <button id="apply-color" type="button" data-i18n="button.color">Color</button>
    <select id="visibility-mode" data-i18n-title="hint.visibility" title="Hide the selection, hide everything else, or show everything">
      <option value="hide" data-i18n="visibility.hide">Hide selection</option>
      <option value="others" data-i18n="visibility.others">Hide others</option>
      <option value="show" data-i18n="visibility.show">Show all</option>
    </select>
    <button id="apply-visibility" type="button" data-i18n="button.apply">Apply</button>
    <button id="export-image" type="button" data-i18n="button.export">Export PNG</button>
    <button id="rep-cartoon" type="button" aria-pressed="true">Cartoon</button>
    <button id="rep-stick" type="button" aria-pressed="false">Stick</button>
    <button id="rep-sphere" type="button" aria-pressed="false">Sphere</button>
    <button id="rep-surface" type="button" aria-pressed="false">Surface</button>
    <button id="clear-selection" type="button" data-i18n="button.clear">Clear</button>
    <button id="explain-selection" type="button" data-i18n="button.explain">Explain in chat</button>
    <span id="selection-echo"></span>
    <span id="recent"></span>
  </div>
  <div id="viewer">
    <div id="splitter-left" class="splitter" data-i18n-title="hint.splitter" title="Drag to resize the left panel"></div>
    <div id="splitter-right" class="splitter" data-i18n-title="hint.splitter" title="Drag to resize the right panel"></div>
  </div>
  <div id="status" data-i18n="status.initializing">initializing viewer…</div>
  <script src="vendor-runtime/molstar-viewer-5.12.0.js"></script>
  <script src="viewer_controls.js"></script>
  <script>
    (async function () {
      'use strict';
      var statusEl = document.getElementById('status');
      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.className = isError ? 'error' : '';
      }

      // Chrome language (#247): the desktop UI language rides the URL on the
      // first open and the viewer://locale event afterwards. Mol* panels keep
      // Mol*'s own language.
      var chromeLang = ViewerControls.normalizeChromeLocale(queryParam('lang'));
      var currentMode = 'structure';
      function t(key, params) {
        return ViewerControls.chromeText(chromeLang, key, params);
      }
      function applyChromeLanguage() {
        ViewerControls.setChromeLocale(chromeLang);
        document.documentElement.lang = chromeLang === 'zh' ? 'zh-CN' : 'en';
        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function (el) {
          el.title = t(el.getAttribute('data-i18n-title'));
        });
        var title = t(currentMode === 'trajectory' ? 'title.trajectory' : 'title.structure');
        document.title = title;
        try {
          window.__TAURI__.core.invoke('set_viewer_window_title', { title: title }).catch(function () {});
        } catch (error) { /* plain browser preview */ }
      }
      applyChromeLanguage();

      var FORMAT_BY_EXT = { pdb: 'pdb', ent: 'pdb', cif: 'cif', mmcif: 'mmcif', gro: 'gro' };
      // Coordinate formats parsed by Mol* mol-io; `.nc` is GROMACS' alternate
      // extension for the same NetCDF container (#193).
      var TRAJ_FORMAT_BY_EXT = { dcd: 'dcd', xtc: 'xtc', trr: 'trr', netcdf: 'netcdf', nc: 'netcdf' };
      function extensionOf(path) {
        var match = /\.([A-Za-z0-9]+)$/.exec(path || '');
        return match ? match[1].toLowerCase() : null;
      }
      function formatFor(table, kind, path) {
        var ext = extensionOf(path);
        if (!ext) throw new Error(kind + ' path has no extension: ' + path);
        var format = table[ext];
        if (!format) throw new Error('unsupported ' + kind + ' extension: ' + ext);
        return format;
      }
      function queryParam(name) {
        var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return match ? decodeURIComponent(match[1]) : null;
      }
      function basename(path) { return path.replace(/^.*[\\/]/, ''); }
      function bytesToU8(bytes) { return new Uint8Array(bytes); }

      var viewer = null;
      var loadSeq = 0;
      var currentPath = queryParam('src') || queryParam('topo') || '';

      function showStructure(path, selection) {
        var seq = ++loadSeq;
        currentPath = path;
        currentMode = 'structure';
        applyChromeLanguage();
        var name = basename(path);
        setStatus(t('status.loading', { name: name }), false);
        var format;
        try { format = formatFor(FORMAT_BY_EXT, 'structure', path); }
        catch (error) { setStatus(String(error.message || error), true); return; }
        window.__TAURI__.core.invoke('read_structure_bytes', { path: path })
          .then(function (bytes) {
            if (seq !== loadSeq) return; // a newer load superseded this one
            // Slice 1 formats (pdb/cif/mmcif/gro) are all text; decode and hand
            // the string to Mol*.
            var data = new TextDecoder().decode(bytesToU8(bytes));
            return ViewerControls.replaceLoadedStructure(viewer, data, format);
          })
          .then(function () {
            if (seq !== loadSeq) return;
            try {
              ViewerControls.clearStructureSelection(viewer.plugin);
              ViewerControls.applyCameraPayload(molstar, viewer.plugin, { action: 'reset' });
            } catch (error) { /* camera follows once the new structure is drawable */ }
            setStatus(name, false);
            // Highlight only this load. A newer pose increments loadSeq and
            // this callback becomes a no-op, so it cannot mark the old scene.
            if (selection) {
              document.getElementById('selection').value = selection;
              applySelection(selection);
            }
          })
          .catch(function (error) {
            if (seq === loadSeq) setStatus(String((error && error.message) || error), true);
          });
      }

      // Trajectory mode (#193): topology text + binary coordinates go through
      // Mol*'s built-in pipeline (loadTrajectory), which wires the mol-io
      // DCD/XTC/TRR/NetCDF readers, the coordinate transform and the animation
      // preset - playback controls come from the vendored viewer itself.
      function showTrajectory(structurePath, trajectoryPath) {
        var seq = ++loadSeq;
        currentPath = structurePath;
        currentMode = 'trajectory';
        applyChromeLanguage();
        var topoName = basename(structurePath);
        var trajName = basename(trajectoryPath);
        setStatus(t('status.loadingTrajectory', { topo: topoName, traj: trajName }), false);
        var topoFormat, trajFormat;
        try {
          topoFormat = formatFor(FORMAT_BY_EXT, 'structure', structurePath);
          trajFormat = formatFor(TRAJ_FORMAT_BY_EXT, 'trajectory', trajectoryPath);
        } catch (error) { setStatus(String(error.message || error), true); return; }
        var invoke = window.__TAURI__.core.invoke;
        Promise.all([
          invoke('read_structure_bytes', { path: structurePath }).then(bytesToU8),
          invoke('read_trajectory_bytes', { path: trajectoryPath }).then(bytesToU8),
        ])
          .then(function (parts) {
            if (seq !== loadSeq) return;
            return ViewerControls.clearLoadedStructures(viewer).then(function () {
              return viewer.loadTrajectory({
                model: {
                  kind: 'model-data',
                  data: new TextDecoder().decode(parts[0]),
                  format: topoFormat,
                },
                modelLabel: topoName,
                coordinates: {
                  kind: 'coordinates-data',
                  data: parts[1], // binary; Mol* readers consume the raw buffer
                  format: trajFormat,
                },
                coordinatesLabel: trajName,
              });
            });
          })
          .then(function () {
            if (seq === loadSeq) setStatus(topoName + ' + ' + trajName, false);
          })
          .catch(function (error) {
            if (seq === loadSeq) setStatus(String((error && error.message) || error), true);
          });
      }

      try {
        viewer = await molstar.Viewer.create(document.getElementById('viewer'), {
          layoutIsExpanded: true,
          layoutShowControls: true,
          layoutShowLeftPanel: true,
          viewportShowExpand: true,
          viewportShowControls: true,
          viewportShowSettings: true,
          viewportShowSelectionMode: true,
          // Animation controls only appear once a trajectory is loaded; safe
          // to keep enabled for the static-structure case too (#193).
          viewportShowAnimation: true
        });
      } catch (error) {
        setStatus('failed to initialize Mol* viewer: ' + String((error && error.message) || error), true);
        return;
      }

      var initial = queryParam('src');
      var initialTopo = queryParam('topo');
      var initialTraj = queryParam('traj');
      if (initial) showStructure(initial, queryParam('sel'));
      else if (initialTopo && initialTraj) showTrajectory(initialTopo, initialTraj);

      try {
        // Reuse path: a window kept open receives later content via these
        // events instead of a disruptive navigation (#192 / #195).
        window.__TAURI__.event.listen('viewer://load-structure', function (event) {
          var path = event && event.payload && event.payload.path;
          var selection = event && event.payload && event.payload.selection;
          if (path) showStructure(path, selection || null);
        });
        window.__TAURI__.event.listen('viewer://load-trajectory', function (event) {
          var payload = event && event.payload;
          if (payload && payload.structure_path && payload.trajectory_path) {
            showTrajectory(payload.structure_path, payload.trajectory_path);
          }
        });
        window.__TAURI__.event.listen('viewer://select', function (event) {
          var expression = event && event.payload && event.payload.expression;
          if (expression) applySelection(expression);
        });
        window.__TAURI__.event.listen('viewer://control-camera', function (event) {
          applyCamera(event && event.payload);
        });
        window.__TAURI__.event.listen('viewer://locale', function (event) {
          var locale = event && event.payload && event.payload.locale;
          if (locale) {
            chromeLang = ViewerControls.normalizeChromeLocale(locale);
            applyChromeLanguage();
          }
        });
      } catch (error) {
        /* event bridge unavailable (plain browser preview) */
      }

      function applySelection(input) {
        var echo = document.getElementById('selection-echo');
        echo.textContent = input;
        ViewerControls.runPymolCommand(molstar, viewer.plugin, input).then(function (message) {
          setStatus(message, false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      }

      function applyCamera(payload) {
        if (!payload || !payload.action) return;
        try {
          ViewerControls.applyCameraPayload(molstar, viewer.plugin, payload);
          setStatus(t('status.camera', { action: payload.action }), false);
        } catch (error) {
          setStatus(String((error && error.message) || error), true);
        }
      }

      ['cartoon', 'stick', 'sphere', 'surface'].forEach(function (kind) {
        document.getElementById('rep-' + kind).addEventListener('click', function (event) {
          var next = event.currentTarget.getAttribute('aria-pressed') !== 'true';
          event.currentTarget.setAttribute('aria-pressed', next ? 'true' : 'false');
          ViewerControls.setStructureRepresentation(viewer.plugin, kind, next).then(function () {
            setStatus(kind + (next ? ' on' : ' off'), false);
          }).catch(function (error) {
            event.currentTarget.setAttribute('aria-pressed', next ? 'false' : 'true');
            setStatus(String((error && error.message) || error), true);
          });
        });
      });
      document.getElementById('apply-selection').addEventListener('click', function () {
        applySelection(document.getElementById('selection').value);
      });
      document.getElementById('zoom-selection').addEventListener('click', function () {
        try {
          var framed = ViewerControls.focusCurrentSelection(molstar, viewer.plugin);
          setStatus(framed === 'selection' ? t('status.zoomedSelection') : t('status.zoomedStructure'), false);
        } catch (error) {
          setStatus(String((error && error.message) || error), true);
        }
      });
      document.getElementById('label-selection').addEventListener('click', function (event) {
        var button = event.currentTarget;
        var next = button.getAttribute('aria-pressed') !== 'true';
        ViewerControls.setSelectionLabels(molstar, viewer.plugin, next).then(function (count) {
          button.setAttribute('aria-pressed', next ? 'true' : 'false');
          setStatus(next ? t('status.labelsOn', { count: count, s: count === 1 ? '' : 's' }) : t('status.labelsOff'), false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      });
      document.getElementById('measure-distance').addEventListener('click', function (event) {
        var button = event.currentTarget;
        var pressed = button.getAttribute('aria-pressed') === 'true';
        if (pressed) {
          ViewerControls.clearMeasuredDistances(viewer.plugin).then(function () {
            button.setAttribute('aria-pressed', 'false');
            setStatus(t('status.distancesCleared'), false);
          }).catch(function (error) {
            setStatus(String((error && error.message) || error), true);
          });
          return;
        }
        ViewerControls.measurePickedDistance(molstar, viewer.plugin).then(function (distance) {
          button.setAttribute('aria-pressed', 'true');
          setStatus(t('status.distance', { value: distance.toFixed(2) }), false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      });
      document.getElementById('apply-color').addEventListener('click', function () {
        var mode = document.getElementById('color-mode').value;
        var applied = mode === 'clear-paint'
          ? ViewerControls.clearViewerPaint(molstar, viewer.plugin)
          : (mode === 'element' || mode === 'chain' || mode === 'spectrum')
            ? ViewerControls.setColorTheme(viewer.plugin, mode).then(function () { return mode; })
            : ViewerControls.paintViewerSelection(molstar, viewer.plugin, mode).then(function () { return mode; });
        applied.then(function (what) {
          setStatus(t('status.coloredBy', { what: t('color.' + what) }), false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      });
      document.getElementById('apply-visibility').addEventListener('click', function () {
        var mode = document.getElementById('visibility-mode').value;
        ViewerControls.setSelectionVisibility(molstar, viewer.plugin, mode).then(function (what) {
          setStatus(what, false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      });
      document.getElementById('export-image').addEventListener('click', function () {
        // Mol* canvases are created with preserveDrawingBuffer, so the current
        // frame survives long enough to be read straight off the element.
        var canvas = document.querySelector('#viewer canvas');
        if (!canvas) {
          setStatus(t('status.noCanvas'), true);
          return;
        }
        var dataUrl;
        try { dataUrl = canvas.toDataURL('image/png'); }
        catch (error) {
          setStatus(String((error && error.message) || error), true);
          return;
        }
        setStatus(t('status.savingImage'), false);
        window.__TAURI__.core.invoke('export_viewer_image', { dataUrl: dataUrl }).then(function (saved) {
          setStatus(saved
            ? t('status.saved', { name: String(saved).replace(/^.*[\\/]/, '') })
            : t('status.exportCancelled'), false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      });
      document.getElementById('clear-selection').addEventListener('click', function () {
        document.getElementById('selection').value = '';
        document.getElementById('selection-echo').textContent = '';
        try {
          ViewerControls.clearStructureSelection(viewer.plugin);
          setStatus(t('status.selectionCleared'), false);
        } catch (error) {
          setStatus(String((error && error.message) || error), true);
        }
      });
      document.getElementById('explain-selection').addEventListener('click', function () {
        if (!currentPath) {
          setStatus(t('status.explainNeedsStructure'), true);
          return;
        }
        setStatus(t('status.askingChat'), false);
        window.__TAURI__.core.invoke('explain_structure_selection', {
          path: currentPath,
          selection: document.getElementById('selection').value || null
        }).then(function () {
          setStatus(t('status.explanationRequested'), false);
        }).catch(function (error) {
          setStatus(String((error && error.message) || error), true);
        });
      });
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.setInterval(function () {
          window.__TAURI__.core.invoke('ui_heartbeat', { snapshot: null }).catch(function () {});
        }, 15000);
      }
      (function bindSplitters() {
        var host = document.getElementById('viewer');
        var widths = { left: 330, right: 300 };
        function clamp(value) { return Math.max(160, Math.min(560, value)); }
        function apply() {
          host.style.setProperty('--side-left', widths.left + 'px');
          host.style.setProperty('--side-right', widths.right + 'px');
        }
        function bind(id, side) {
          document.getElementById(id).addEventListener('pointerdown', function (event) {
            event.preventDefault();
            var startX = event.clientX;
            var start = widths[side];
            function move(next) {
              var delta = next.clientX - startX;
              widths[side] = clamp(side === 'left' ? start + delta : start - delta);
              apply();
            }
            function up() {
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', up);
            }
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
          });
        }
        bind('splitter-left', 'left');
        bind('splitter-right', 'right');
      })();
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('list_viewer_recent').then(function (paths) {
          document.getElementById('recent').textContent = (paths || []).slice(0, 3).map(function (path) {
            return path.replace(/^.*[\\/]/, '');
          }).join(' · ');
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
